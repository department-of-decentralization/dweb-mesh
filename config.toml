# DWeb Camp 2026 Mesh — Zola config.
# base_url = "/" → host-less root paths; the same build works at GitHub Pages
# (mesh.dod.ngo) and on the offline Freifunk host, with no DNS dependency.
# See SPEC.md D2. To deploy under a subpath: `zola build --base-url /sub/`.
base_url = "/"
title = "DWeb Camp 2026 Mesh"
description = "Join the camp LoRa mesh. Offline-first node docs."
default_language = "en"

compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = false

[extra]
matrix_room = "#dweb-mesh:dod.ngo"
matrix_url = "https://matrix.to/#/#dweb-mesh:dod.ngo"
mesh_nest_location = "tent 5"
meshcore_channel = "#dwebcamp"
dashboard_url = "https://dweb.potatomesh.net"
dashboard_label = "dweb.potatomesh.net"
tickets_url = "https://dwebcamp.org/tickets"
dwebcamp_url = "https://dwebcamp.org"
# Pretalx (talx.dod.ngo) schedule widget JSON - the runtime source for the /workshop
# live time sync (SPEC T1/T4). Single-sourced here, rendered onto schedule-live.js as a
# data-endpoint attribute (not an asset src). Data fetch only; the offline copy falls
# back to the hardcoded sessions, so check-offline.sh never sees this URL.
pretalx_widget_url = "https://talx.dod.ngo/dwebcamp-2026/schedule/widget/v2.json"
