{% extends "base.html" %}
{% block title %}JOIN THE MESH &middot; {{ config.title }}{% endblock title %}
{% block content %}
<section class="splash">
  <h1 class="splash-title">JOIN<br>THE<br>MESH</h1>

  <p class="splash-meta">July 8-12, Alte Hölle, Wiesenburg<br>dwebcamp.org</p>

  <div class="hud" aria-label="Live mesh stats">
    <div class="hud-item">
      <span class="hud-label">NODES</span>
      <span class="hud-value" id="stat-nodes">-</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">MESSAGES</span>
      <span class="hud-value" id="stat-messages">-</span>
    </div>
  </div>

  <p class="splash-cta"><a class="btn" href="{{ get_url(path='@/start/_index.md') }}">&#9654; START</a></p>
  <p class="splash-buy"><a href="{{ config.extra.tickets_url | safe }}" target="_blank" rel="noopener">BUY DEVICE &#8599;</a></p>

  <div class="latest" id="latest" hidden aria-label="Recent mesh messages"></div>
</section>
{% endblock content %}
{% block scripts %}
<script src="{{ get_url(path='js/counters.js') }}"></script>
{% endblock scripts %}
