name: Deploy to GitHub Pages

# Canonical public build. The Freifunk copy is a MANUAL drop of `public/` —
# this workflow never touches it (SPEC.md D10).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o zola.tar.gz
          tar xzf zola.tar.gz
          sudo install -m 0755 zola /usr/local/bin/zola
          zola --version

      - name: Build (base_url from config = "/")
        run: zola build

      - name: Offline self-containment gate
        run: |
          chmod +x scripts/check-offline.sh
          scripts/check-offline.sh public

      - name: Add custom-domain CNAME to the artifact
        run: if [ -f CNAME ]; then cp CNAME public/CNAME; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
